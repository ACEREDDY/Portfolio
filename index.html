<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keshav Reddy Studios</title>
<meta name="description" content="Portfolio of Keshav Reddy, wildlife photographer and nature conservationist based in Hyderabad.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Dune Rise by Fontswan, SIL Open Font License 1.1 (see fonts/Dune_Rise-OFL.txt) */
  @font-face {
    font-family: "Dune Rise";
    src: url(fonts/Dune_Rise.ttf) format("truetype");
    font-display: swap;
  }

  /* ---------- Theme ---------- */
  :root {
    --bg: #0f0f10;
    --fg: #e8e8e6;
    --muted: #8a8a88;
    --wordmark: #e8e8e6;
    --overlay-bg: #e2e2e0;
    --overlay-fg: #161616;
    --pill-bg: #161616;
    --pill-fg: #f2f2f0;
    --accent: #e0102f;
    --card: #18181a;
    --field: #0b0b0c;
    --line: rgba(255,255,255,.09);
    /* Glass pill bars (genre switcher, "What's this about?") */
    --glass-bg: rgba(255,255,255,.045); --glass-edge: rgba(255,255,255,.17); --glass-hi: rgba(255,255,255,.10);
    --glass-drop: rgba(0,0,0,.45);
    --lens-hi: rgba(255,255,255,.10); --lens-lo: rgba(255,255,255,.018);
    --lens-rim: rgba(255,255,255,.45); --lens-shade: rgba(0,0,0,.38);
    --lens-lift-hi: rgba(255,255,255,.28); --lens-lift-lo: rgba(255,255,255,.07); --lens-ring: rgba(255,255,255,.24);
    --lens-base: rgba(30,30,33,.84);  /* frosted tint so labels under the lens don't show through */
    --spring: cubic-bezier(.34, 1.36, .64, 1);
    --mono: "JetBrains Mono", ui-monospace, monospace;    --gutter: clamp(16px, 4vw, 48px);
    --ease: cubic-bezier(.22, .8, .2, 1);
  }
  :root[data-theme="light"] {
    --bg: #e6e6e3;
    --fg: #161616;
    --muted: #6b6b68;
    --wordmark: #161616;
    --overlay-bg: #0f0f10;
    --overlay-fg: #e8e8e6;
    --pill-bg: #e8e8e6;
    --pill-fg: #161616;
    --accent: #0047ff;
    --card: #efefec;
    --field: #f8f8f6;
    --line: rgba(0,0,0,.1);
    --glass-bg: rgba(255,255,255,.55); --glass-edge: rgba(0,0,0,.07); --glass-hi: rgba(255,255,255,.9);
    --glass-drop: rgba(0,0,0,.12);
    --lens-hi: rgba(255,255,255,.95); --lens-lo: rgba(255,255,255,.45);
    --lens-rim: rgba(255,255,255,1); --lens-shade: rgba(0,0,0,.14);
    --lens-lift-hi: rgba(255,255,255,.98); --lens-lift-lo: rgba(255,255,255,.6); --lens-ring: rgba(255,255,255,1);
    --lens-base: rgba(246,246,243,.86);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background .5s var(--ease), color .5s var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Fixed chrome ---------- */
  .menu-btn {
    position: fixed; top: 24px; right: var(--gutter); z-index: 60;
    width: 44px; height: 44px; display: grid; place-items: center;
    mix-blend-mode: difference; color: #fff;
  }
  .menu-btn span, .menu-btn span::before {
    display: block; width: 22px; height: 2px; background: currentColor;
    transition: transform .4s var(--ease);
  }
  .menu-btn span { position: relative; transform: translateY(-3px); }
  .menu-btn span::before { content: ""; position: absolute; top: 6px; }
  body.menu-open .menu-btn { mix-blend-mode: normal; color: var(--overlay-fg); }
  body.menu-open .menu-btn span { transform: translateY(0) rotate(45deg); }
  body.menu-open .menu-btn span::before { transform: translateY(-6px) rotate(-90deg); }

  .theme-btn {
    position: fixed; left: var(--gutter); bottom: 24px; z-index: 60;
    width: 44px; height: 44px; display: grid; place-items: center;
    mix-blend-mode: difference; color: #fff;
  }
  .theme-btn svg { width: 20px; height: 20px; transition: transform .6s var(--ease); }
  :root[data-theme="light"] .theme-btn svg { transform: rotate(180deg); }

  .logo-small {
    position: fixed; top: 30px; left: var(--gutter); z-index: 60;
    font-family: "Dune Rise", "Syne", sans-serif; font-weight: 400; font-size: 17px; line-height: 1;
    letter-spacing: .08em; text-transform: uppercase;
    mix-blend-mode: difference; color: #fff;
    opacity: 0; transition: opacity .4s var(--ease);
  }
  /* Small "STUDIOS" line centered under the name, like the favicon */
  .logo-small .studios {
    display: block; margin-top: 6px; text-align: center;
    font-size: 8px; letter-spacing: .7em; padding-left: .7em;  /* the padding re-centers the trailing space */
  }
  body.scrolled .logo-small { opacity: 1; }

  /* ---------- Hero wordmark ---------- */
  .wordmark {
    position: fixed; inset: 0; z-index: 0;
    display: grid; align-items: center; justify-items: center; pointer-events: none;
    padding: 0 var(--gutter);
    will-change: opacity, transform;
  }
  /* Leopard artwork: the PNG is only a cut-out shape, filled with the same color as the name,
     so it follows light/dark mode and fades with the name on scroll. */
  .leopard {
    position: absolute; top: 0; right: 0; height: 100%;
    aspect-ratio: 721 / 1125; max-width: 100%;
    background: var(--wordmark);
    -webkit-mask: url(photos/leopard.png) no-repeat right center / contain;
            mask: url(photos/leopard.png) no-repeat right center / contain;
    transform-origin: right center;
    animation: breathe 7s 2.6s ease-in-out infinite alternate;
    will-change: transform;
  }

  /* ---------- Cat motion ----------
     Two nested layers per cat: .cat-layer does the light/dark crossfade, .cat-intro the page-load
     entrance, and the cat itself a slow "breathing" scale. Everything animates only opacity and
     transform, which the browser hands to the graphics card, so it stays smooth (no blur or clipping,
     which have to be redrawn every frame). */
  :root { --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-in-soft: cubic-bezier(.55, 0, .7, .2); }
  .cat-layer {
    position: absolute; inset: 0; pointer-events: none;
    will-change: opacity, transform;
    /* Coming in: starts just after the outgoing cat begins to leave, so the two overlap */
    transition: opacity 1s var(--ease-out) .15s, transform 1.4s var(--ease-out) .1s, visibility 0s;
  }
  :root:not([data-theme="light"]) .cat-layer--leopard,
  :root[data-theme="light"] .cat-layer--panther {
    opacity: 0; visibility: hidden;
    /* Going out: quick, gentle acceleration away */
    transition: opacity .6s var(--ease-in-soft), transform .8s var(--ease-in-soft), visibility 0s linear .8s;
  }
  :root:not([data-theme="light"]) .cat-layer--leopard { transform: translate3d(8%, 0, 0) scale(.94); }
  :root[data-theme="light"] .cat-layer--panther { transform: translate3d(-8%, 0, 0) scale(.94); }
  .cat-layer--leopard { transform-origin: right center; }
  .cat-layer--panther { transform-origin: left bottom; }

  /* Page-load entrance: the leopard glides in from the right, the panther rises from the ground */
  .cat-intro { position: absolute; inset: 0; will-change: opacity, transform; }
  .cat-layer--leopard .cat-intro { transform-origin: right center; animation: leopard-in 2s .2s var(--ease-out) both; }
  .cat-layer--panther .cat-intro { transform-origin: left bottom;  animation: panther-in 2s .2s var(--ease-out) both; }
  @keyframes leopard-in { from { opacity: 0; transform: translate3d(10%, 0, 0) scale(1.06); } }
  @keyframes panther-in { from { opacity: 0; transform: translate3d(0, 10%, 0) scale(1.04); } }
  @keyframes breathe { to { transform: scale(1.012); } }

  .wordmark h1 {
    position: relative;
    font-family: "Syne", sans-serif; font-weight: 800;
    text-transform: uppercase; text-align: center;
    /* Same size and spot in both themes, small enough to clear the leopard or the panther */
    font-size: clamp(32px, min(5.2vw, 9.5vh), 120px);
    line-height: .86; letter-spacing: -.02em;
    color: var(--wordmark);
    transition: color .5s var(--ease);
  }
  .wordmark h1 .line { display: block; overflow: hidden; }
  .wordmark h1 .line > span {
    display: inline-block; transform: translateY(105%);
    animation: rise 1.2s var(--ease) forwards;
  }
  .wordmark h1 .line:nth-child(2) > span { animation-delay: .12s; }
  @keyframes rise { to { transform: none; } }
  /* A small misty pine forest inside each line of the name (the scene is drawn in the script) */
  :root { --forest: var(--forest-dark); }
  :root[data-theme="light"] { --forest: var(--forest-light); }
  .wordmark h1 .line > span {
    color: transparent; -webkit-text-fill-color: transparent;
    background: var(--forest) no-repeat 50% 0 / 7.4em 100%;
    -webkit-background-clip: text; background-clip: text;
  }
  .wordmark h1 .line:nth-child(2) > span { background-position: 20% 0; }  /* a different stretch of forest */
  /* Tall screens (phones, portrait tablets): face on top, name underneath */
  @media (max-aspect-ratio: 3/2) {
    .wordmark { align-items: end; padding-bottom: 13vh; padding-bottom: 13svh; }
    .leopard { top: 5vh; height: 58%; }
    .wordmark h1 { font-size: clamp(36px, min(11vw, 10vh), 150px); }
  }

  /* ---------- Dark mode hero: panther only (leopard hidden), name centered ---------- */
  .panther {
    position: absolute; left: calc(var(--gutter) / 2); bottom: 0; height: 92%;
    aspect-ratio: 900 / 1612; max-width: 100%;
    background: linear-gradient(172deg, #ececea 0%, #c6c6c3 45%, #8c8c89 100%);
    -webkit-mask: url(photos/panther.png) no-repeat left bottom / contain;
            mask: url(photos/panther.png) no-repeat left bottom / contain;
    transform-origin: left bottom;
    animation: breathe 7s 2.6s ease-in-out infinite alternate;
    will-change: transform;
  }
  /* Tall screens in dark mode: panther centered on top, name centered below */
  @media (max-aspect-ratio: 3/2) {
    :root:not([data-theme="light"]) .panther {
      top: 6vh; bottom: auto; height: 60%; max-width: 90%;
      left: 0; right: 0; margin-inline: auto; transform-origin: center bottom;
      -webkit-mask-position: center bottom; mask-position: center bottom;
    }
  }

  .hero-spacer { height: 100vh; height: 100svh; position: relative; }
  .scroll-hint {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: fade 1s .9s forwards;
  }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- Gallery ---------- */
  .work { position: relative; z-index: 1; }
  /* Genre switcher: same pill control as the contact form, pinned below the top bar while scrolling the work */
  .genre-bar {
    position: sticky; top: 84px; z-index: 5;
    display: flex; justify-content: center;
    padding: 0 var(--gutter); margin-bottom: 9vh;
    pointer-events: none;
  }
  .genre-bar .topics {
    margin-top: 0; pointer-events: auto; flex-wrap: nowrap; max-width: 100%;
    transition: background .5s var(--ease), border-color .5s var(--ease);
  }
  .genre-bar .topics button { flex: none; white-space: nowrap; }
  .gallery {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(12, 1fr);
    column-gap: var(--gutter); row-gap: 14vh;
    align-items: start;
    padding: 0 var(--gutter) 20vh;
    transition: opacity .35s var(--ease), transform .45s var(--ease);
  }
  /* While switching genre: the old photos fade and sink slightly, then the new ones take their place */
  .gallery.is-switching { opacity: 0; transform: translate3d(0, 24px, 0); }
  .shot {
    position: relative; margin-top: var(--mt, 0);
    grid-column: var(--col);
    will-change: transform;
  }
  .shot figure {
    position: relative; overflow: hidden; border-radius: 3px;
    aspect-ratio: var(--ratio, 4/5); background: #1c1c1e; cursor: zoom-in;
  }
  .shot img {
    transform: scale(1.08); opacity: 0;
    transition: transform 1.4s var(--ease), opacity 1s var(--ease);
  }
  .shot.in img { transform: scale(1); opacity: 1; }
  .shot figure:hover img { transform: scale(1.035); }
  .shot figcaption {
    display: flex; justify-content: space-between; gap: 12px;
    padding-top: 10px; font-size: 12px; color: var(--muted);
    letter-spacing: .02em;
  }
  .shot figcaption b { color: var(--fg); font-weight: 500; }

  /* ---------- Sections ---------- */
  .about, .contact {
    position: relative; z-index: 1; background: var(--bg);
    padding: 18vh var(--gutter);
    transition: background .5s var(--ease);
  }
  .about {
    display: grid; grid-template-columns: repeat(12, 1fr);
    column-gap: var(--gutter); row-gap: 48px; align-items: center;
  }
  .about .portrait {
    grid-column: 2 / 6; aspect-ratio: 2/3; overflow: hidden; border-radius: 3px; background: #111;
  }
  .about-copy { grid-column: 7 / 12; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .about h2 {
    margin-top: 18px;
    font-size: clamp(28px, 3.8vw, 56px); font-weight: 600;
    line-height: 1.08; letter-spacing: -.025em;
  }
  .about p {
    margin-top: 24px; max-width: 34ch;
    font-size: clamp(17px, 1.5vw, 21px); line-height: 1.5; color: var(--muted);
    font-style: italic;
  }
  .about .services {
    margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px;
  }
  .about .services li { list-style: none; }
  .about .services button {
    padding: 8px 16px; border: 1px solid var(--muted);
    border-radius: 999px; font-size: 14px; color: var(--muted);
    transition: color .3s, border-color .3s;
  }
  .about .services button:hover { color: var(--accent); border-color: var(--accent); }
  /* ---------- Contact ---------- */
  .contact { border-top: 1px solid var(--line); padding-top: 14vh; padding-bottom: 14vh; }
  .contact-head { max-width: 1240px; margin: 0 auto 56px; }
  .contact-head h2 {
    margin-top: 14px; font-family: "Syne", sans-serif; font-weight: 800;
    font-size: clamp(36px, 6vw, 84px); line-height: .95; letter-spacing: -.02em; text-transform: uppercase;
  }
  .contact-grid {
    max-width: 1240px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: clamp(32px, 6vw, 88px); align-items: start;
  }
  .label {
    display: block; font-family: var(--mono); font-size: 11.5px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }

  .contact-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: clamp(22px, 3vw, 40px);
    transition: background .5s var(--ease);
  }
  .topics {
    margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px;
    padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--field);
  }
  .topics button {
    padding: 9px 16px; border-radius: 999px; font-size: 14.5px; color: var(--muted);
    transition: color .25s, background .25s, box-shadow .25s;
  }
  .topics button:hover { color: var(--fg); }
  .topics button[aria-pressed="true"] {
    color: var(--accent); font-weight: 600;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 1px 6px rgba(0,0,0,.25);
  }

  /* ---------- Glass pill bars ----------
     The bar is frosted glass; the selected option sits under a glass "lens" that slides (and can be
     dragged) between options. The lens blurs what is under it and shows the label slightly magnified
     in the accent color, like looking through a droplet. */
  .topics.glass {
    position: relative; isolation: isolate;
    /* Corner roundness = half an option's height + padding + border: a one-line bar is a pill, and a bar that
       wraps onto several lines becomes a rounded rectangle whose corners still fit the lens */
    border-radius: calc(var(--row-h, 40px) / 2 + 6px);
    -webkit-user-select: none; user-select: none;  /* dragging the lens shouldn't highlight the labels */
    background: var(--glass-bg); border-color: var(--glass-edge);
    -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 32px var(--glass-drop), 0 2px 6px var(--glass-drop);
    transition: background .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease);
  }
  .topics.glass button,
  .topics.glass button[aria-pressed="true"] {
    position: relative; z-index: 1;
    background: none; box-shadow: none; text-shadow: none; color: var(--muted); font-weight: 400;
    transition: color .2s var(--ease);
  }
  /* Once the lens has arrived, hide the plain label under it so only the magnified one shows */
  .topics.glass button[aria-pressed="true"] { color: transparent; transition: color .2s var(--ease) .35s; }
  /* While the lens is picked up it can leave the selected option, so show that label again */
  .topics.glass.lens-lifted button[aria-pressed="true"] { color: var(--muted); transition: color .15s var(--ease); }
  .glass-lens {
    position: absolute; left: 0; top: 0; z-index: 2;
    border-radius: 999px; overflow: hidden; cursor: grab; touch-action: none;
    background: radial-gradient(130% 100% at 50% -10%, var(--lens-hi), var(--lens-lo) 58%, var(--lens-lo)), var(--lens-base);
    -webkit-backdrop-filter: blur(8px) saturate(1.6); backdrop-filter: blur(8px) saturate(1.6);
    box-shadow:
      inset 0 -12px 18px -14px var(--lens-shade),  /* darker underside, like a curved droplet */
      inset 0 10px 14px -14px var(--lens-rim),     /* bright rim along the top */
      0 12px 28px var(--glass-drop), 0 2px 6px var(--glass-drop);
    transition: transform .6s var(--spring), width .5s var(--spring), height .5s var(--spring), scale .3s var(--ease),
                background .25s var(--ease), box-shadow .25s var(--ease);
    will-change: transform;
  }
  .glass-lens.moving { scale: 1.07 .93; }  /* a little squash while it travels after a click */
  /* Pressed / dragged: the lens lifts off the bar like a picked-up droplet: bigger, milkier, brighter
     rim, a faint accent glow, and stronger magnification. It keeps one size and glides freely. */
  .glass-lens.lifted {
    background: radial-gradient(130% 100% at 50% -10%, var(--lens-lift-hi), var(--lens-lift-lo) 62%, var(--lens-lift-lo)), var(--lens-base);
    -webkit-backdrop-filter: blur(8px) saturate(1.8) brightness(1.12); backdrop-filter: blur(8px) saturate(1.8) brightness(1.12);
    box-shadow:
      inset 0 -14px 20px -14px var(--lens-shade),
      inset 0 12px 16px -12px var(--lens-rim),
      inset 0 0 0 1px var(--lens-ring),
      0 18px 40px var(--glass-drop),
      0 0 26px color-mix(in srgb, var(--accent) 22%, transparent);
    transition: transform .35s var(--spring), width .35s var(--spring), height .35s var(--spring),
                background .25s var(--ease), box-shadow .25s var(--ease);
  }
  .glass-lens.dragging {
    cursor: grabbing;
    transition: width .35s var(--spring), height .35s var(--spring), background .25s var(--ease), box-shadow .25s var(--ease);
  }
  .glass-lens.no-anim, .glass-lens.no-anim .lens-content { transition: none; }
  .lens-content {
    position: absolute; pointer-events: none; transform: scale(1.06);
    transition: left .6s var(--spring), top .6s var(--spring), transform-origin .6s var(--spring), transform .35s var(--spring);
  }
  .glass-lens.lifted .lens-content {
    transform: scale(1.12);
    transition: left .35s var(--spring), top .35s var(--spring), transform-origin .35s var(--spring), transform .35s var(--spring);
  }
  .glass-lens.dragging .lens-content { transition: transform .35s var(--spring); }
  .lens-content span {
    position: absolute; display: flex; align-items: center; justify-content: center;
    white-space: nowrap; color: var(--accent); font-weight: 600;
  }
  :root:not([data-theme="light"]) .lens-content span {
    text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .fields { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 18px; }
  .fields .full { grid-column: 1 / -1; }
  .fields .label { margin-bottom: 12px; }
  .fields .label em { font-style: normal; text-transform: none; letter-spacing: .04em; }
  .fields input, .fields textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg);
    background: var(--field); border: 1px solid var(--line); border-radius: 8px;
    padding: 15px 18px; outline: none; transition: border-color .25s, box-shadow .25s;
  }
  .fields textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
  .fields input::placeholder, .fields textarea::placeholder { color: var(--muted); opacity: .8; }
  .fields input:focus, .fields textarea:focus {
    border-color: color-mix(in srgb, var(--accent) 70%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .send {
    margin-top: 32px; display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; border-radius: 999px; font-size: 16px; font-weight: 500;
    background: var(--fg); color: var(--bg); transition: transform .3s var(--ease), gap .3s var(--ease);
  }
  .send:hover { transform: translateY(-2px); gap: 14px; }

  .contact-info > * + * { margin-top: 56px; }
  .direct .mail {
    display: inline-block; margin-top: 14px; color: var(--accent);
    font-size: clamp(20px, 2vw, 26px); font-weight: 500; overflow-wrap: anywhere;
    background: linear-gradient(currentColor, currentColor) no-repeat 0 100% / 0 1.5px;

/* ---------- Forest inside the name ----------
   Pine silhouettes in layers of fog, drawn as an SVG and shown through the letters.
   Seeded random, so the forest looks the same on every visit. */
{
  const rng = seed => () => (seed = seed * 16807 % 2147483647) / 2147483647;
  // One fir: drooping branch tiers up both sides, plus a trunk
  const pine = (r, x, base, h) => {
    const w = h * (.34 + r() * .1), tiers = 8 + Math.floor(r() * 4), crownBase = base - h * .14;
    const tierH = (h * .86) / tiers, right = [], left = [];
    for (let i = 0; i < tiers; i++) {
      const t = i / tiers, y = crownBase - tierH * i, half = (w / 2) * (1 - t) ** .9;
      right.push([x + half * (.8 + r() * .35), y + r() * tierH * .2], [x + half * .3, y - tierH * .6]);
      left.unshift([x - half * .3, y - tierH * .6], [x - half * (.8 + r() * .35), y + r() * tierH * .2]);
    }
    const pts = [[x + w * .03, crownBase], ...right, [x, base - h], ...left, [x - w * .03, crownBase]];
    const tw = Math.max(1.5, w * .045);
    return `M${(x - tw).toFixed(1)} ${base} V${crownBase} ` +
      pts.map(([px, py]) => `L${px.toFixed(1)} ${py.toFixed(1)}`).join(" ") + ` L${(x + tw).toFixed(1)} ${crownBase} V${base} Z`;
  };
  // A row of trees; `where` is how likely a tree is at each point across (0..1)
  const row = (r, n, width, base, hMin, hMax, where = () => 1) => {
    let d = "";
    for (let i = 0; i < n; i++) {
      const x = r() * width;
      if (r() > where(x / width)) continue;
      d += pine(r, x, base + r() * 6, hMin + r() * (hMax - hMin));
    }
    return d;
  };
  const edges = u => Math.min(1, (Math.abs(u - .5) * 2) ** 1.6 * 1.3 + .08);  // denser toward the sides
  const forest = ({ fogTop, fogLow, far, mid, near }) => {
    const r = rng(11), W = 1480, H = 172;
    const fog = (id, a) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${fogTop}" stop-opacity="${a}"/><stop offset="1" stop-color="${fogLow}" stop-opacity="${a * .5}"/></linearGradient>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${fogTop}"/><stop offset="1" stop-color="${fogLow}"/></linearGradient>${fog("f1", .55)}${fog("f2", .4)}</defs>

      <path fill="${far}" d="${row(r, 120, W, H - 14, 60, 105)}"/>
      <rect width="${W}" height="${H}" fill="url(#f1)"/>
      <path fill="${mid}" d="${row(r, 80, W, H - 7, 80, 125, u => .4 + edges(u) * .6)}"/>
      <rect width="${W}" height="${H}" fill="url(#f2)"/>
      <path fill="${near}" d="${row(r, 60, W, H, 100, 150, u => .25 + edges(u) * .75)}"/>
      <rect y="${H - 10}" width="${W}" height="10" fill="${near}"/>
    </svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

}

/* ---------- Glass pill bars ----------
   Turns a bar of aria-pressed buttons into frosted glass with a sliding glass lens over the selected
   option. The lens follows aria-pressed (so the bar's own click handler stays in charge), and it can be
   dragged: on release it snaps to the nearest option and clicks it. */
function glassify(bar, { contain = false } = {}) {  // contain: keep the lifted lens inside the bar's edges
  bar.classList.add("glass");
  const lens = document.createElement("div");
  lens.className = "glass-lens";
  lens.setAttribute("aria-hidden", "true");
  const content = document.createElement("div");
  content.className = "lens-content";
  lens.append(content);
  bar.append(lens);

  const buttons = () => [...bar.querySelectorAll("button")];
  let pos = { x: 0, y: 0, w: 0, h: 0 };

  // Accent copies of every label, laid out exactly like the real buttons; the lens shows them magnified
  function layoutLabels() {
    content.style.width = bar.scrollWidth + "px";
    content.style.height = bar.scrollHeight + "px";
    content.innerHTML = buttons().map(b =>
      `<span style="left:${b.offsetLeft}px;top:${b.offsetTop}px;width:${b.offsetWidth}px;height:${b.offsetHeight}px;font-size:${getComputedStyle(b).fontSize}">${b.textContent}</span>`).join("");
  }
  function place(x, y, w, h) {
    pos = { x, y, w, h };
    lens.style.transform = `translate(${x}px, ${y}px)`;
    lens.style.width = w + "px";
    lens.style.height = h + "px";
    content.style.left = -x + "px";
    content.style.top = -y + "px";
    content.style.transformOrigin = `${x + w / 2}px ${y + h / 2}px`;
  }
  function toActive(animate = true) {
    const b = bar.querySelector('[aria-pressed="true"]');
    if (!b) return;
    if (!animate) lens.classList.add("no-anim");
    place(b.offsetLeft, b.offsetTop, b.offsetWidth, b.offsetHeight);
    if (!animate) { void lens.offsetWidth; lens.classList.remove("no-anim"); return; }
    lens.classList.add("moving");
    clearTimeout(lens.squash);
    lens.squash = setTimeout(() => lens.classList.remove("moving"), 260);
  }
  const nearest = (cx, cy) => buttons().reduce((best, b) => {
    const d = Math.hypot(b.offsetLeft + b.offsetWidth / 2 - cx, b.offsetTop + b.offsetHeight / 2 - cy);
    return d < best.d ? { b, d } : best;
  }, { b: null, d: Infinity }).b;

  const refresh = () => {
    bar.style.setProperty("--row-h", buttons()[0].offsetHeight + "px");
    layoutLabels();
    toActive(false);
  };
  // For a contained bar: nudge a lens rect (centered at cx, cy) so it stays clear of the bar's edges
  const keepInside = (cx, cy, w, h) => contain ? [
    Math.min(Math.max(cx, w / 2 + 3), bar.clientWidth - w / 2 - 3),
    Math.min(Math.max(cy, h / 2 + 2), bar.clientHeight - h / 2 - 2),
  ] : [cx, cy];
  refresh();
  document.fonts.ready.then(refresh);
  new ResizeObserver(refresh).observe(bar);
  new MutationObserver(() => toActive()).observe(bar, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });

  // Pressing lifts the lens: it grows (bulging past the bar where there's room) and then glides at that
  // one size, centered under the finger, until it's let go.
  let drag = null;
  lens.addEventListener("pointerdown", e => {
    e.preventDefault();  // a mouse drag would otherwise start selecting text across the page
    const cx = pos.x + pos.w / 2, cy = pos.y + pos.h / 2;
    const scrolls = bar.scrollWidth > bar.clientWidth + 1;  // a sideways-scrolling bar would clip a tall lens
    const w = contain ? Math.min(pos.w * 1.06 + 8, bar.clientWidth - 6) : pos.w * 1.12 + 14;
    const h = pos.h * (contain || scrolls ? 1.08 : 1.45);
    drag = { sx: e.clientX, sy: e.clientY, cx, cy, w, h };
    lens.setPointerCapture(e.pointerId);
    lens.classList.add("lifted");  // grows smoothly around its center
    bar.classList.add("lens-lifted");
    const [x, y] = keepInside(cx, cy, w, h);
    place(x - w / 2, y - h / 2, w, h);
  });
  lens.addEventListener("pointermove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 2) lens.classList.add("dragging");  // now follow the finger instantly
    const centers = buttons().map(b => [b.offsetLeft + b.offsetWidth / 2, b.offsetTop + b.offsetHeight / 2]);
    const cx = Math.min(Math.max(drag.cx + e.clientX - drag.sx, Math.min(...centers.map(c => c[0]))), Math.max(...centers.map(c => c[0])));
    const cy = Math.min(Math.max(drag.cy + e.clientY - drag.sy, Math.min(...centers.map(c => c[1]))), Math.max(...centers.map(c => c[1])));
    const [x, y] = keepInside(cx, cy, drag.w, drag.h);
    place(x - drag.w / 2, y - drag.h / 2, drag.w, drag.h);
  });
  const release = () => {
    if (!drag) return;
    drag = null;
    lens.classList.remove("dragging", "lifted");
    bar.classList.remove("lens-lifted");
    const target = nearest(pos.x + pos.w / 2, pos.y + pos.h / 2);
    if (target && target.getAttribute("aria-pressed") !== "true") target.click();
    setTimeout(() => toActive(), 0);  // snap home if the click didn't change the selection
  };
  lens.addEventListener("pointerup", release);
  lens.addEventListener("pointercancel", release);
}

const form = $("#contact-form");
let topic = SITE.topics[0];
$("#topics").innerHTML = SITE.topics.map((t, i) =>
  `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${t.label}</button>`).join("");
$("#message").placeholder = topic.hint;
$("#topics").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  topic = SITE.topics[b.dataset.i];
  $("#topics").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("#message").placeholder = topic.hint;
});
glassify($("#topics"), { contain: true });
form.addEventListener("submit", e => {
  e.preventDefault();
  const invalid = [...form.querySelectorAll("[required]")].find(f => !f.checkValidity());
  if (invalid) { invalid.reportValidity(); return; }
  const d = Object.fromEntries(new FormData(form));
  const subject = `${topic.label} — ${d.name}${d.org ? ` (${d.org})` : ""}`;
  const body = `${d.message}\n\n— ${d.name}\n${d.email}${d.org ? `\n${d.org}` : ""}`;
  window.open(gmailCompose(subject, body), "_blank", "noopener");
});
$("#copyright").textContent = `© ${new Date().getFullYear()} ${fullName}`;
$("#location").textContent = SITE.location;

/* ---------- Gallery layout ----------
   Lays photos out two to a row on the 12-column grid, like the wildlife page: width comes from the
   photo's shape, rows alternate between leaning left and leaning right, and the second photo in a row
   sits a little lower. On phones (6 columns) wide photos go full width and tall ones alternate sides. */
function autoLayout(list, label) {
  const span = r => r > 2 ? 7 : r > 1.2 ? 6 : r > 0.75 ? 5 : r >= 0.6 ? 4 : 3;
  const drop = ["10vh", "6vh", "12vh"];
  const out = [];
  let row = 0;
  for (let i = 0; i < list.length; row++) {
    const [a, b] = [list[i], list[i + 1]].map(x => x && { src: "photos/" + x[0], title: x[1], ratio: `${x[2]}/${x[3]}`, w: span(x[2] / x[3]) });
    const pair = b && a.w + b.w <= 11;
    if (pair) {
      const lean = Math.ceil((12 - a.w - b.w) / 3);
      const aStart = row % 2 ? 1 : 1 + lean, bEnd = row % 2 ? 13 - lean : 13;
      out.push({ ...a, col: `${aStart} / ${aStart + a.w}`, mt: "0", speed: 0.04 },
               { ...b, col: `${bEnd - b.w} / ${bEnd}`, mt: drop[row % 3], speed: 0.02 });
      i += 2;
    } else {
      const start = row % 2 ? 12 - a.w : 2;
      out.push({ ...a, col: `${start} / ${start + a.w}`, mt: "0", speed: 0.03 });
      i += 1;
    }
  }
  return out.map((p, k) => ({ ...p, client: label,
    colM: p.w >= 6 ? "1 / 7" : k % 2 ? "3 / 7" : "1 / 5" }));
}
const GENRES = SITE.genres.map(g => ({ ...g, photos: g.photos || autoLayout(g.auto, g.label) }));

/* ---------- Reveal on scroll ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const img = e.target.querySelector("img");
    const show = () => e.target.classList.add("in");
    img.complete ? show() : img.addEventListener("load", show, { once: true });
    io.unobserve(e.target);
  });
}, { rootMargin: "0px 0px -10% 0px" });

const gallery = $("#gallery");
let photos = [], shots = [];
// Fisher–Yates shuffle (returns a new array)
const shuffled = list => {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};
// A genre's photos as [file, title, width, height], whether it was listed that way or hand-placed
const asAutoList = g => g.auto || g.photos.map(p => [p.src.replace(/^photos\//, ""), p.title, ...p.ratio.split("/").map(Number)]);
function renderGallery(genre) {
  photos = genre.shuffle ? autoLayout(shuffled(asAutoList(genre)), genre.label) : genre.photos;
  io.disconnect();
  gallery.innerHTML = photos.map((p, i) => `
    <div class="shot" data-speed="${p.speed}" data-i="${i}"
         style="--col:${p.col};--col-m:${p.colM};--ratio:${p.ratio};--mt:${p.mt}">
      <figure>
        <img src="${p.src}" alt="${p.title}" loading="lazy">
      </figure>
      <figcaption><b>${p.title}</b><span>${p.client}</span></figcaption>
    </div>`).join("");
  shots = [...gallery.querySelectorAll(".shot")];
  shots.forEach(s => io.observe(s));
}

/* ---------- Genre switcher ---------- */
const genreBar = $("#genres");
genreBar.innerHTML = GENRES.map((g, i) =>
  `<button type="button" data-genre="${g.id}" aria-pressed="${i === 0}">${g.label}</button>`).join("");
let activeGenre = GENRES[0].id, switching = false;
function selectGenre(id) {
  const genre = GENRES.find(g => g.id === id);
  if (!genre || id === activeGenre || switching) return;
  activeGenre = id;
  genreBar.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.genre === id));
  genreBar.querySelector(`[data-genre="${id}"]`).scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  switching = true;
  gallery.classList.add("is-switching");
  setTimeout(() => {
    renderGallery(genre);
    // If the visitor is further down the gallery, bring the new genre in from its first photo
    const top = $("#work").getBoundingClientRect().top + scrollY;
    if (scrollY > top + 10) scrollTo({ top, behavior: "instant" });
    onScroll();
    void gallery.offsetWidth; // commit the new photos before fading back in
    gallery.classList.remove("is-switching");
    switching = false;
  }, reduceMotion ? 0 : 360);
}
genreBar.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) selectGenre(b.dataset.genre);
});
glassify(genreBar);
renderGallery(GENRES[0]);

// The genre tags in the About section jump to that genre in the gallery
$("#services").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  $("#work").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
  selectGenre(b.dataset.genre);
});

/* ---------- Parallax + wordmark fade ---------- */
const word = $(".wordmark"); // name + leopard fade together
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let ticking = false;

function onScroll() {
  const y = scrollY, vh = innerHeight;
  // Name and leopard dim and shrink slightly as photos pass over it, then hides behind the about section.
  const t = Math.min(y / vh, 1);
  word.style.opacity = 1 - t * 0.82;
  word.style.transform = `scale(${1 - t * 0.06})`;
  document.body.classList.toggle("scrolled", y > vh * 0.6);

  if (!reduceMotion) {
    // Speeds are kept small (and halved on phones) so drifting photos never close the gap between rows.
    const scale = innerWidth < 760 ? 0.5 : 1;
    shots.forEach(s => {
      const r = s.getBoundingClientRect();
      const offset = (r.top + r.height / 2 - vh / 2) * -parseFloat(s.dataset.speed) * scale;
      s.style.transform = `translate3d(0, ${offset.toFixed(1)}px, 0)`;
    });
  }
  ticking = false;
}
addEventListener("scroll", () => { if (!ticking) { requestAnimationFrame(onScroll); ticking = true; } }, { passive: true });
addEventListener("resize", onScroll);
onScroll();

/* ---------- Menu ---------- */
const menuBtn = $(".menu-btn");
function setMenu(open) {
  document.body.classList.toggle("menu-open", open);
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
}
menuBtn.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
document.querySelectorAll("[data-close]").forEach(a => a.addEventListener("click", () => setMenu(false)));

/* ---------- Theme ---------- */
const root = document.documentElement;
try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch {}
$(".theme-btn").addEventListener("click", () => {
  const next = root.dataset.theme === "light" ? "dark" : "light";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
});

/* ---------- Lightbox ---------- */
const lb = $(".lightbox");
let current = 0;
function showPhoto(i) {
  current = (i + photos.length) % photos.length;
  const p = photos[current];
  $("img", lb).src = p.src;
  $("img", lb).alt = p.title;
  $(".cap", lb).textContent = `${p.title} — ${p.client}  ·  ${current + 1} / ${photos.length}`;
}
function closeLightbox() { lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); }
gallery.addEventListener("click", e => {
  const shot = e.target.closest(".shot");
  if (!shot) return;
  showPhoto(+shot.dataset.i);
  lb.classList.add("open");
  lb.setAttribute("aria-hidden", "false");
});
$(".prev", lb).addEventListener("click", e => { e.stopPropagation(); showPhoto(current - 1); });
$(".next", lb).addEventListener("click", e => { e.stopPropagation(); showPhoto(current + 1); });
lb.addEventListener("click", closeLightbox);
addEventListener("keydown", e => {
  if (e.key === "Escape") { closeLightbox(); setMenu(false); }
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowLeft") showPhoto(current - 1);
  if (e.key === "ArrowRight") showPhoto(current + 1);
});
</script>
</body>
